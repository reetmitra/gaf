[project]
name = "gaf"
version = "0.1.0"
description = "Grounded AI Futures — a reproducible hybrid human-LLM grounded-theory coding pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Reet Mitra" }]

# Core dependencies: the entire offline path installs from this list alone.
# No provider SDK is required to run the pipeline, the checks, or the tests.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    # Upper bound is deliberate: scikit-learn 1.10 removes `penalty=` from
    # LogisticRegressionCV and changes its fitted attributes. Brief §13 specifies
    # `penalty="l1", solver="liblinear"` verbatim, so we pin below that break.
    # See ADR-0011.
    "scikit-learn>=1.4,<1.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Live model runs are opt-in. Nothing in tests or CI may import these.
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
anthropic = ["anthropic>=0.34"]
live = ["openai>=1.40", "google-genai>=0.3", "anthropic>=0.34"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gaf = "gaf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:gaf.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default argument — not used; noise on dataclass fields
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# RUF001 flags "ambiguous" Unicode (curly quotes, en/em dashes, no-break spaces).
# These three files exist precisely to contain those characters: textnorm.py folds
# them, and the two test/fixture files supply the input that proves it folds them.
# Suppressing the rule here is the point, not an oversight.
"gaf/textnorm.py" = ["RUF001"]
"tests/fixtures/corpus.py" = ["RUF001"]
"tests/test_contracts.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["gaf"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "openpyxl.*"]
ignore_missing_imports = true
