<desc id="d">Coder A against coder B, comparisons (1,137): agreed outright 302 (26.6%), grey zone, sent to the judge 592 (52.1%), disputed or unmatched 243 (21.4%). Whom the judge sided with, rulings (592): coder A 331 (55.9%), coder B 0 (0.0%), neither 261 (44.1%).</desc>
